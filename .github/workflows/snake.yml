name: Generate Contribution Snake

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: RanggaFebrio25
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23D8502A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232AA8C8
      - name: Publish files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
